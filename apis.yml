aid: interpol
name: Interpol
description: >-
  INTERPOL (International Criminal Police Organization) is an inter-governmental organization with 196 member countries
  that helps police worldwide work together to make the world a safer place. INTERPOL exposes a public Notices web
  service that returns Red, Yellow, and UN Notices data. An OpenAPI description of that service is published by the
  bundesAPI community and mirrored in this repository.
